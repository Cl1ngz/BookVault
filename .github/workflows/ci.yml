name: Full CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # BACKEND
  backend:
    name: Backend — compile + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: biblioteka_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/biblioteka_db?currentSchema=biblioteka
      DB_USER: app_BookVault
      DB_PASS: App1dent1ty#Pass!
      JWT_SECRET: bookvaultsupersecretkeyismustbenoway
      JWT_EXPIRATION: 86400000

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Initialise database
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls init-db/*.sql | sort); do
            echo "▶ $f"
            psql -h localhost -U postgres -d biblioteka_db -f "$f" || true
          done

      - name: Compile
        working-directory: backend
        run: ./mvnw -B compile --no-transfer-progress

      - name: Test
        working-directory: backend
        run: |
          ./mvnw -B test --no-transfer-progress \
            -Dspring.datasource.url="${DB_URL}" \
            -Dspring.datasource.username="${DB_USER}" \
            -Dspring.datasource.password="${DB_PASS}" \
            -Djwt.secret="${JWT_SECRET}" \
            -Djwt.expiration="${JWT_EXPIRATION}"

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "backend/target/surefire-reports/TEST-*.xml"
          check_name: "Backend Tests"
          fail_on_failure: trueDB_PASS

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  # FRONTEND
  frontend:
    name: Frontend — type-check + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build-only

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

  # SUMMARY — required status check for branch protection
  ci-ok:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "❌ Backend job failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ Frontend job failed"
            exit 1
          fi
          echo "✅ All jobs passed"

