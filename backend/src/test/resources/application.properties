# Values are overridable via Maven -D flags or environment variables.
# CI passes them explicitly; local dev falls back to the defaults below.

spring.datasource.url=${spring.datasource.url:jdbc:postgresql://localhost:5432/biblioteka_db?currentSchema=biblioteka}
spring.datasource.username=${spring.datasource.username:app_BookVault}
spring.datasource.password=${spring.datasource.password:App1dent1ty#Pass!}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=biblioteka
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt.secret=${jwt.secret:bookvaultsupersecretkeyismustbenoway}
jwt.expiration=${jwt.expiration:86400000}

# Silence noisy logs during tests
logging.level.root=WARN
logging.level.com.bookvault=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.results=OFF
